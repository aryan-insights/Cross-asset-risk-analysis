const perfK=()=>K([['Total return',x=>m(x).tot,v=>sg(v,0),'pn',T1],['CAGR',x=>m(x).cagr,sg,'pn',T1],['Avg daily return',x=>m(x).avgd,v=>sg(v,2),'pn',T1],['Best month',x=>m(x).best,sg,'pn',T1],['Worst month',x=>m(x).worst,sg,'pn',T1],['Positive days',x=>m(x).pos,pc,'',T1]]);
const riskK=()=>K([['Volatility',x=>m(x).vol,pc,'',T1],['Max drawdown',x=>m(x).dd,sg,'pn',T1],['Sharpe',x=>m(x).sh,f2,'pn',T1],['Sortino',x=>m(x).so,f2,'pn',T1],['VaR 95%',x=>m(x).var,sg,'pn',T1],['CVaR 95%',x=>m(x).cvar,sg,'pn',T1]]);

overview(){const best=(f,hi)=>X.reduce((u,v)=>(hi?f(v)>f(u):f(v)<f(u))?v:u),cg=best(x=>m(x).cagr,1),sh=best(x=>m(x).sh,1),lv=best(x=>m(x).vol,0),sd=best(x=>m(x).dd,1),dd=best(x=>m(x).dd,0),vr=best(x=>m(x).var,0),p=sim([.7,.2,.1]),n=sim([1,0,0]);

return `<section class="kpi" style="--n:4">${C('Top CAGR',pc(m(cg).cagr),'b',NM[cg]+' · '+(1+m(cg).tot).toFixed(1)+'× growth')}${C('Best Sharpe',f2(m(sh).sh),'b',NM[sh])}${C('Lowest volatility',pc(m(lv).vol),'',NM[lv])}${C('Shallowest drawdown',pc(m(sd).dd),'r',NM[sd])}${C('Deepest drawdown',pc(m(dd).dd),'r',NM[dd])}${C('Worst VaR 95%',pc(m(vr).var),'r',NM[vr])}${C('Avg correlation',f2(avgC()),'','Selected assets')}${C('70/20/10 Sharpe',f2(p.sh),'b','vs '+f2(n.sh)+' NIFTY only')}</section>`+DL()+
sec('Normalized performance','Value of 100 invested at the start of the selected period'+`<div class="leg">${X.map(x=>`<span><i style="background:${CL[x]}"></i>${NM[x]} <b>${Math.round(S.wealth[x][st.b]/S.wealth[x][st.a]*100).toLocaleString()}</b></span>`).join('')}</div>`+`<div class="seg" id="lgb" style="width:max-content;margin-top:8px"><button data-l="1" class="${st.lg?'on':''}">Log</button><button data-l="0" class="${st.lg?'':'on'}">Linear</button></div>`,cvs('c1'))+
`<section class="two">`+sec('Risk comparison','',bars([['Volatility','vol','#f2f2f0'],['Max drawdown','dd','#ef4444'],['VaR 95%','var','#8b8b93']]))+sec('Summary','Full-period findings',`<ul><li><b>Bitcoin led on return</b> (64.3% CAGR) with about 4× the volatility of gold or NIFTY.</li><li><b>Its 83% drawdown took about three years to recover;</b> NIFTY’s 38% crash, under a year.</li><li><b>Correlations are near zero</b> (0.03 to 0.09 daily).</li><li><b>A 70/20/10 mix</b> lifted Sharpe from 0.63 to 1.18 and cut max drawdown from −38.4% to −30.4%.</li><li><b>Gold’s 2026 drawdown is still open.</b></li></ul>`)+'</section>'},
performance(){const as=X[0];Q.push(()=>{const[,k]=per('BTC',st.a,st.b,'A'),yrs=k;chart('ar','bar',{labels:yrs,datasets:X.map((x,j)=>({label:NM[x],data:per(x,st.a,st.b,'A')[0],backgroundColor:per(x,st.a,st.b,'A')[0].map(v=>(v>=0?'rgba(59,130,246,':'rgba(239,68,68,')+[1,.7,.45][AS.indexOf(x)]+')'),borderRadius:3}))},{xs:1,yf:v=>pc(v,0),cb:{label:c=>c.dataset.label+': '+sg(c.parsed.y)}})});priceDD('pr','nn');
return perfK()+DL()+`<section class="two">`+sec('Historical price','Closing price, log scale (BTC and gold in USD, NIFTY in INR points)',cvs('pr'))+sec('Annual returns','Bars per year: Bitcoin, gold, NIFTY. Blue gain, red loss',cvs('ar'))+'</section>'+sec('Monthly returns',NM[as]+', % per month. Select one asset to change it',heat(as))},
risk(){const x1=X[0];Q.push(()=>{chart('rv','line',{labels:L(),datasets:X.map(x=>ln(x,roll(x,0,st.w,st.a,st.b)))},{leg:1,yf:v=>pc(v,0),cb:{label:c=>c.dataset.label+': '+pc(c.parsed.y)}});chart('dd','line',{labels:L(),datasets:X.map(x=>{let pk=0;return ln(x,S.wealth[x].slice(st.a,st.b+1).map(w=>{pk=Math.max(pk,w);return w/pk-1}))})},{leg:1,yf:v=>pc(v,0),cb:{label:c=>c.dataset.label+': '+pc(c.parsed.y)}});hist(x1)});
return riskK()+DL()+`<section class="two">`+sec('Rolling volatility',st.w+'-day window, annualized',cvs('rv'))+sec('Drawdown','Distance below previous peak',cvs('dd'))+'</section><section class="two">'+sec('Return distribution',NM[x1]+', '+{D:'daily',M:'monthly',A:'annual'}[st.f]+' returns. Red marks the worst 5%',cvs('hs'))+sec('VaR and CVaR','95% confidence, historical simulation',bars([['VaR 95%','var','#8b8b93'],['CVaR 95%','cvar','#ef4444']]))+'</section>'},
diversification(){const pr=[],pw=[(100-st.pb-st.pg)/100,st.pg/100,st.pb/100],ps=sim(pw),n=sim([1,0,0]);const pairs=[['BTC','GOLD'],['BTC','NIFTY'],['GOLD','NIFTY']],cc={'BTC,GOLD':'#f2f2f0','BTC,NIFTY':'#3b82f6','GOLD,NIFTY':'#8b8b93'};
const R=Object.fromEntries(AS.map(x=>[x,per(x,st.a,st.b,st.f)[0]])),cr=(u,v)=>u===v?1:cor(R[u],R[v]);
Q.push(()=>{chart('rc','line',{labels:L(),datasets:pairs.filter(p=>X.includes(p[0])&&X.includes(p[1])).map(p=>({label:NM[p[0]]+' / '+NM[p[1]],data:roll(p[0],p[1],st.w,st.a,st.b),borderColor:cc[p],borderWidth:1.6,pointRadius:0}))},{leg:1,yf:v=>v.toFixed(1),cb:{label:c=>c.dataset.label+': '+c.parsed.y.toFixed(2)}});
const mix=[['100% NIFTY',[1,0,0]],['95/0/5',[.95,0,.05]],['90/0/10',[.9,0,.1]],['90/10/0',[.9,.1,0]],['80/10/10',[.8,.1,.1]],['70/20/10',[.7,.2,.1]],['Equal',[1/3,1/3,1/3]]];
chart('sx','scatter',{datasets:[{label:'Assets',data:AS.map(x=>({x:m(x).vol,y:m(x).cagr,n:NM[x]})),backgroundColor:'#f2f2f0',pointRadius:7},{label:'NIFTY / gold / BTC mixes',data:mix.map(q=>{const s=sim(q[1]);return{x:s.vol,y:s.cagr,n:q[0]}}),backgroundColor:'#3b82f6',pointRadius:5}]},{xs:1,im:'nearest',leg:1,xf:v=>(+v*100).toFixed(0)+'%',yf:v=>pc(v,0),cb:{label:c=>c.raw.n+': vol '+pc(c.raw.x)+', CAGR '+pc(c.raw.y)}});
$('#sb').oninput=e=>{st.pb=Math.min(+e.target.value,100-st.pg);render()};$('#sg').oninput=e=>{st.pg=Math.min(+e.target.value,100-st.pb);render()}});
const cl=v=>`style="background:${v>=0?'rgba(59,130,246,':'rgba(239,68,68,'}${Math.abs(v)*.9})"`;
const r1=(l,a,b,f)=>`<tr><td>${l}</td><td>${f(a)}</td><td>${f(b)}</td></tr>`;
return `<section class="kpi" style="--n:3">${C('Avg correlation',f2(avgC()),'','Selected assets')}${C('BTC / Gold',f2(cr('BTC','GOLD')),'','Correlation')}${C('BTC / NIFTY',f2(cr('BTC','NIFTY')),'','Correlation')}${C('Gold / NIFTY',f2(cr('GOLD','NIFTY')),'','Correlation')}${C('Mix return',pc(ps.cagr),ps.cagr>=n.cagr?'b':'r','CAGR vs '+pc(n.cagr)+' NIFTY only')}${C('Mix Sharpe',f2(ps.sh),ps.sh>=n.sh?'b':'r','vs '+f2(n.sh)+' NIFTY only')}</section>`+DL()+
`<section class="two">`+sec('Correlation matrix',{D:'Daily',M:'Monthly',A:'Annual'}[st.f]+' returns, selected period','<div class="sc"><table><tr><th></th>'+AS.map(x=>`<th>${NM[x]}</th>`).join('')+'</tr>'+AS.map(u=>`<tr><td>${NM[u]}</td>`+AS.map(v=>{const c=cr(u,v);return `<td class="c" ${cl(c)}>${f2(c)}</td>`}).join('')+'</tr>').join('')+'</table></div>')+sec('Rolling correlation',st.w+'-day window',cvs('rc'))+'</section>'+
`<section class="two">`+sec('Risk and return','Annualized volatility (x) vs CAGR (y). White: assets, blue: portfolio mixes',cvs('sx'))+sec('Portfolio analysis','Daily rebalancing, no costs, 0% risk-free',`<label class="mu sm">BTC weight <b>${st.pb}%</b></label><input type="range" id="sb" min="0" max="50" value="${st.pb}"><label class="mu sm">Gold weight <b>${st.pg}%</b></label><input type="range" id="sg" min="0" max="50" value="${st.pg}"><div class="mu sm">NIFTY weight ${100-st.pb-st.pg}%</div><table style="margin-top:8px"><tr><th></th><th>Your mix</th><th>100% NIFTY</th></tr>${r1('Return (CAGR)',ps.cagr,n.cagr,pc)}${r1('Volatility',ps.vol,n.vol,pc)}${r1('Sharpe',ps.sh,n.sh,f2)}${r1('Max drawdown',ps.dd,n.dd,pc)}</table>`)+'</section>'},
behaviour(){const w=st.b-st.a,e=X.map(x=>[x,m(x)]),bs=e.reduce((u,v)=>v[1].tot>u[1].tot?v:u),ws=e.reduce((u,v)=>v[1].tot<u[1].tot?v:u),dp=e.reduce((u,v)=>v[1].dd<u[1].dd?v:u);
Q.push(()=>chart('ce','bar',{labels:EV.map(q=>q[0]),datasets:X.map(x=>({label:NM[x],data:EV.map(q=>M(x,ix(q[1]),ix(q[2])).tot),backgroundColor:EV.map(q=>(M(x,ix(q[1]),ix(q[2])).tot>=0?'rgba(59,130,246,':'rgba(239,68,68,')+[1,.7,.45][AS.indexOf(x)]+')'),borderRadius:3}))},{xs:1,yf:v=>pc(v,0),cb:{label:c=>c.dataset.label+': '+sg(c.parsed.y)}}));
const rc=D.drawdown_events.filter(q=>X.includes(q.asset_code)),mx=Math.max(...rc.map(q=>q.days_peak_to_trough+(q.days_trough_to_recovery||0)));
return `<section class="kpi" style="--n:5">${C('Window',w+' days',  '',fd(S.dates[st.a])+' to '+fd(S.dates[st.b]))}${C('Best in window',sg(bs[1].tot,0),'b',NM[bs[0]])}${C('Weakest in window',sg(ws[1].tot,0),ws[1].tot<0?'r':'',NM[ws[0]])}${C('Deepest drawdown',pc(dp[1].dd),'r',NM[dp[0]])}${C('Avg correlation',f2(avgC()),'','In window')}</section>`+DL()+
sec('Crisis comparison','Bars per event: Bitcoin, gold, NIFTY 50. Blue gain, red loss. Pick an event above to filter every page',cvs('ce'))+
sec('Recovery analysis','Worst drawdown of each asset: days from peak to trough, then to recovery','<div class="leg"><span><i style="background:#ef4444"></i>Peak to trough</span><span><i style="background:#3b82f6"></i>Trough to recovery</span></div>'+rc.map(q=>{const d=q.days_peak_to_trough,u=q.days_trough_to_recovery;return `<div class="m"><div class="t">${NM[q.asset_code]}: ${pc(q.max_drawdown_pct/100)} · ${fd(q.peak_date)} to ${u?fd(q.recovery_date):'not yet recovered'}</div><div style="display:flex;gap:3px"><div class="tr" style="width:${d/mx*100}%;background:#ef4444;height:12px"></div>${u?`<div class="tr" style="width:${u/mx*100}%;background:#3b82f6;height:12px"></div>`:''}</div><div class="mu sm">${d} days down${u?', '+u+' days to recover':''}</div></div>`}).join(''))}};
function render(){MC={};Q=[];const h=location.hash.slice(1)||'overview',ast=h.startsWith('asset-')?h.slice(6).toUpperCase():null;X=ast?[ast]:st.as;
$('#nv').innerHTML=PG.map(p=>`<a href="#${p[0]}" class="${p[0]===h?'on':''}">${p[1]}</a>`).join('');$('#ttl').textContent=ast?NM[ast]+': asset detail':(PG.find(p=>p[0]===h)||PG[0])[1];
let o;if(st.b-st.a<20)o=sec('Period too short','Select at least 20 trading days.','');else if(ast)o=`<a class="bk" href="#overview" style="margin:0">← Back to overview</a>`+perfK()+riskK()+sec('Price','Closing price, log scale',cvs('pr'))+sec('Drawdown','',cvs('nn'))+`<section class="two">`+sec('Return distribution','Red marks the worst 5%',cvs('hs'))+sec('Monthly returns','',heat(ast))+'</section>';else o=(PAGES[h]||PAGES.overview)();
$('#main').innerHTML=o;if(st.b-st.a>=20){if(ast){priceDD('pr','nn');Q.push(()=>hist(ast))}Q.forEach(f=>f())}
$('#df').value=S.dates[st.a];$('#dt').value=S.dates[st.b];$('#yr').value=st.yr;$('#ev').value=st.ev;
[...$('#as').children].forEach(b=>b.classList.toggle('on',st.as.includes(b.dataset.v)));[...$('#fq').children].forEach(b=>b.classList.toggle('on',b.dataset.v===st.f));[...$('#wn').children].forEach(b=>b.classList.toggle('on',+b.dataset.v===st.w))}
function setR(a,b){st.a=Math.max(0,a);st.b=Math.min(N-1,b);render()}
$('#asof').innerHTML='Data as of '+fd(D.meta.data_as_of)+'<br>Exported '+D.meta.generated_at;
$('#df').min=$('#dt').min=S.dates[0];$('#df').max=$('#dt').max=S.dates[N-1];
$('#yr').innerHTML='<option value="">All years</option>'+[...new Set(S.dates.map(d=>d.slice(0,4)))].map(y=>`<option>${y}</option>`).join('');

$('#as').innerHTML=AS.map(x=>`<button data-v="${x}">${NM[x]}</button>`).join('');
$('#df').onchange=()=>{st.yr=st.ev='';setR(ix($('#df').value),st.b)};$('#dt').onchange=()=>{st.yr=st.ev='';const i=S.dates.findIndex(d=>d>$('#dt').value);setR(st.a,i<0?N-1:i-1)};
$('#yr').onchange=e=>{st.yr=e.target.value;st.ev='';if(!st.yr)return setR(0,N-1);const i=S.dates.map(d=>d.slice(0,4)).indexOf(st.yr),j=S.dates.map(d=>d.slice(0,4)).lastIndexOf(st.yr);setR(i-1,j)};
$('#ev').onchange=e=>{st.ev=e.target.value;st.yr='';const q=EV.find(z=>z[0]===st.ev);q?setR(ix(q[1]),ix(q[2])):setR(0,N-1)};
$('#as').onclick=e=>{const v=e.target.dataset.v;if(!v)return;st.as=st.as.includes(v)?st.as.filter(x=>x!==v):AS.filter(x=>x===v||st.as.includes(x));if(!st.as.length)st.as=[v];render()};
$('#fq').onclick=e=>{if(e.target.dataset.v){st.f=e.target.dataset.v;render()}};$('#wn').onclick=e=>{if(e.target.dataset.v){st.w=+e.target.dataset.v;render()}};

$('#doc').innerHTML=[['Data source','Yahoo Finance via the yfinance library: BTC-USD (Bitcoin, USD), GC=F (COMEX gold futures, USD per troy ounce) and ^NSEI (NIFTY 50 index, INR points). Stored in PostgreSQL.'],['Frequency','Daily closing prices. Only days when all three markets traded are used ('+D.meta.common_days.toLocaleString()+' days). Monthly and annual views compound daily returns.'],['Analysis period',fd(D.meta.first_date)+' to '+fd(D.meta.data_as_of)+'. Slicers change the window.'],['Returns','Simple returns between consecutive common trading days. CAGR = growth^(252/days) − 1. Annualized with 252 days, 12 months or 1 year, matching the return frequency.'],['Risk-free rate','0% for Sharpe and Sortino.'],['VaR and CVaR','95% confidence, historical simulation: the 5th percentile of returns, and the average of returns at or below it.'],['Currency','Returns are in each asset’s own currency, with no FX conversion. Gold is a continuous COMEX futures series in USD, so contract rollovers can add small price jumps. Mixes assume daily rebalancing and no costs.'],['Reading this','Historical evidence only. Past results do not predict future returns. Built with Claude (AI-assisted) and checked against SQL calculations.']].map(q=>`<div><b>${q[0]}</b><span>${q[1]}</span></div>`).join('');
